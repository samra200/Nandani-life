<!DOCTYPE html>
<html>
<head>
<title>Project 2 - Goods In</title>


<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.3/xlsx.full.min.js"></script>


<style>
body{
font-family:Arial;
text-align:center;
margin:20px;
}


input,button{
padding:10px;
margin:5px;
text-transform:uppercase;
}


.table-container{
overflow-x:auto;
}


table{
width:100%;
border-collapse:collapse;
margin-top:20px;
min-width:1000px;
}


th,td{
border:1px solid black;
padding:8px;
}


th{
background:#f4f4f4;
}


.total-box{
margin-top:10px;
font-weight:bold;
}


.edit-mode{
background:#fff3cd;
}


@media(max-width:600px){
input,button{
width:90%;
}
}
</style>
</head>


<body>


<h2>PROJECT 2 - GOODS IN</h2>


<input type="date" id="dateInput">


<input list="villageList"
id="villageInput"
placeholder="Village">


<datalist id="villageList"></datalist>


<input type="number"
id="weightInput"
placeholder="Weight">


<input type="number"
id="receiptInput"
placeholder="Receipt No">


<input list="carList"
id="carInput"
placeholder="Car No">


<datalist id="carList"></datalist>


<input list="sellerList"
id="sellerInput"
placeholder="Seller">


<datalist id="sellerList">
<option value="SAMRA GADHVI">
<option value="MUNNA BHAI">
<option value="CHETAN BHAI">
</datalist>


<br>


<button onclick="addData()">Add</button>


<button onclick="downloadExcel()">
Download Excel
</button>


<button onclick="enableEditMode()">
Edit
</button>


<button onclick="verifyPassword(clearData)">
Clear All
</button>


<br><br>


<input type="text"
id="searchInput"
placeholder="Search or #exclude"
onkeyup="renderTable()">


<input type="date"
id="fromDate"
onchange="renderTable()">


<input type="date"
id="toDate"
onchange="renderTable()">


<div class="total-box">


Total:
<span id="totalFiltered">0</span>


|


Godown Left:
<span id="godownLeft">0</span>


|


Entries:
<span id="entryCount">0</span>


</div>


<div class="table-container">


<table>


<thead>
<tr>
<th>Date</th>
<th>Village</th>
<th>Weight</th>
<th>Receipt</th>
<th>Car</th>
<th>Seller</th>
</tr>
</thead>


<tbody id="dataList"></tbody>


</table>


</div>


<script>


const STORAGE_KEY="project2Data";
const PASSWORD="3532";


let editMode=false;


const villageOrder=[
"GODOWN",
"MUNDRA",
"SADAU",
"KAPAYA",
"BAROI",
"VANDH",
"GOYAR",
"SHEKHADIYA",
"LUNI",
"RAGA",
"HAMIRAMORA",
"MANGRA",
"BORANA"
];


let villageListData=[...villageOrder];


function loadVillageList(){


let list=villageList;


list.innerHTML="";


villageListData.forEach(v=>{


let opt=document.createElement("option");


opt.value=v;


list.appendChild(opt);


});


}


function getToday(){
return new Date()
.toISOString()
.split('T')[0];
}


window.onload=function(){


let today=getToday();


dateInput.value=today;
fromDate.value=today;
toDate.value=today;


loadVillageList();


renderTable();


};


function getData(){


return JSON.parse(
localStorage.getItem(STORAGE_KEY)
)||[];


}


function saveData(data){


localStorage.setItem(
STORAGE_KEY,
JSON.stringify(data)
);


}


function sortData(data){


return data.sort((a,b)=>{


if(a[0]!==b[0]){
return a[0].localeCompare(b[0]);
}


let va=villageOrder.indexOf(a[1]);
let vb=villageOrder.indexOf(b[1]);


if(va===-1) va=999;
if(vb===-1) vb=999;


if(va!==vb){
return va-vb;
}


return Number(a[3]||0)
-
Number(b[3]||0);


});


}


function getFilteredData(){


let data=sortData(getData());


let search=searchInput.value
.toLowerCase()
.trim();


let words=search.split(" ")
.filter(Boolean);


let includeWords=
words.filter(w=>!w.startsWith("#"));


let excludeWords=
words
.filter(w=>w.startsWith("#"))
.map(w=>w.substring(1));


return data.filter(row=>{


let text=row.join(" ")
.toLowerCase();


if(includeWords.length){


let found=
includeWords.some(word=>
text.includes(word)
);


if(!found) return false;


}


for(let word of excludeWords){


if(text.includes(word)){
return false;
}


}


if(fromDate.value &&
row[0]<fromDate.value)
return false;


if(toDate.value &&
row[0]>toDate.value)
return false;


return true;


});


}


function addData(){


let data=getData();


let seller=
sellerInput.value.toUpperCase()
||
"SAMRA GADHVI";


let village=
villageInput.value.toUpperCase();


let row=[
dateInput.value,
village,
weightInput.value,
receiptInput.value,
carInput.value.toUpperCase(),
seller
];


if(!dateInput.value ||
!weightInput.value){
alert("Date and Weight required");
return;
}


if(receiptInput.value){


if(data.some(
r=>r[3]===receiptInput.value
)){
alert("Duplicate receipt!");
return;
}


}


if(village &&
!villageListData.includes(village)){


villageListData.push(village);


loadVillageList();


}


data.push(row);


saveData(data);


villageInput.value="";
weightInput.value="";
receiptInput.value="";
carInput.value="";
sellerInput.value="";


renderTable();


}


function renderTable(){


let tbody=dataList;


tbody.innerHTML="";


let filtered=getFilteredData();


filtered.forEach(row=>{


let tr=document.createElement("tr");


if(editMode){


tr.classList.add("edit-mode");


row.forEach(cell=>{


let td=document.createElement("td");


td.innerHTML=
`<input value="${cell}">`;


tr.appendChild(td);


});


}else{


row.forEach(cell=>{


let td=document.createElement("td");


td.textContent=cell;


tr.appendChild(td);


});


}


tbody.appendChild(tr);


});


updateTotals();


}


function updateTotals(){


let filtered=getFilteredData();


let total=filtered.reduce(
(sum,row)=>
sum+(parseFloat(row[2])||0),
0
);


totalFiltered.textContent=total;


entryCount.textContent=
filtered.length;


calculateGodownLeft();


}


function calculateGodownLeft(){


let p2=getData();


let godown=p2
.filter(r=>r[1]==="GODOWN")
.reduce(
(sum,row)=>
sum+(parseFloat(row[2])||0),
0
);


let p1=JSON.parse(
localStorage.getItem("dataList")
)||[];


let outTotal=p1.reduce(
(sum,row)=>
sum+(parseFloat(row[2])||0),
0
);


godownLeft.textContent=
godown-outTotal;


}


function enableEditMode(){


verifyPassword(()=>{


editMode=!editMode;


if(editMode){


let saveBtn=document.createElement("button");


saveBtn.id="saveEditBtn";


saveBtn.textContent="Save All";


saveBtn.onclick=saveAllEdits;


document.body.insertBefore(
saveBtn,
document.querySelector(".table-container")
);


}else{


let btn=
document.getElementById("saveEditBtn");


if(btn) btn.remove();


}


renderTable();


});


}


function saveAllEdits(){


let rows=
document.querySelectorAll(
"#dataList tr"
);


let newData=[];


rows.forEach(r=>{


let inputs=
r.querySelectorAll("input");


let row=[];


inputs.forEach(i=>{
row.push(
i.value.toUpperCase()
);
});


newData.push(row);


});


saveData(newData);


editMode=false;


document
.getElementById("saveEditBtn")
.remove();


renderTable();


}


function verifyPassword(cb){


let p=prompt("Password:");


if(p===PASSWORD){
cb();
}else{
alert("Wrong password");
}


}


function clearData(){


localStorage.removeItem(STORAGE_KEY);


renderTable();


}


function downloadExcel(){


let rows=getFilteredData();


let ws=
XLSX.utils.aoa_to_sheet([


[
"Date",
"Village",
"Weight",
"Receipt",
"Car",
"Seller"
],


...rows


]);


let wb=
XLSX.utils.book_new();


XLSX.utils.book_append_sheet(
wb,
ws,
"Data"
);


XLSX.writeFile(
wb,
"project2.xlsx"
);


}


villageInput.addEventListener(
"change",
()=>weightInput.focus()
);


carInput.addEventListener(
"change",
()=>{
if(dateInput.value &&
weightInput.value){
addData();
}
}
);


</script>


</body>
</html>
