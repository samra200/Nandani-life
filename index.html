<!DOCTYPE html>
<html>
<head>
<title>Project 2 Data Entry</title>


<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.3/xlsx.full.min.js"></script>


<style>
body{
font-family:Arial;
text-align:center;
margin:20px;
}


input,button{
padding:10px;
margin:5px;
text-transform:uppercase;
}


.table-container{
overflow-x:auto;
}


table{
width:100%;
border-collapse:collapse;
margin-top:20px;
min-width:900px;
}


th,td{
border:1px solid black;
padding:8px;
}


th{
background:#f4f4f4;
}


.total-box{
margin-top:10px;
font-weight:bold;
}


@media(max-width:600px){
input,button{
width:90%;
}
}
</style>
</head>


<body>


<h2>Project 2 Data Entry</h2>


<input type="date" id="dateInput">


<input list="sellerList" id="sellerInput" placeholder="Seller">
<datalist id="sellerList">
<option value="MUNNA BHAI">
<option value="CHETAN BHAI">
</datalist>


<input list="villageList" id="villageInput" placeholder="Village">
<datalist id="villageList"></datalist>


<input type="number" id="weightInput" placeholder="Weight">


<input type="number" id="receiptInput" placeholder="Receipt No">


<input list="carList" id="carInput" placeholder="Car No">
<datalist id="carList"></datalist>


<br>


<button onclick="addData()">Add</button>
<button onclick="verifyPassword(clearData)">Clear All</button>
<button onclick="downloadExcel()">Download Excel</button>


<br><br>


<input type="text"
id="searchInput"
placeholder="Search or use #word to exclude"
onkeyup="renderTable()">


<input type="date"
id="fromDate"
onchange="renderTable()">


<input type="date"
id="toDate"
onchange="renderTable()">


<div class="total-box">
Total (All):
<span id="totalAll">0</span>
|
Total (Filtered):
<span id="totalFiltered">0</span>
</div>


<div class="table-container">
<table>
<thead>
<tr>
<th>Date</th>
<th>Seller</th>
<th>Village</th>
<th>Weight</th>
<th>Receipt</th>
<th>Car</th>
<th>Action</th>
</tr>
</thead>


<tbody id="dataList"></tbody>
</table>
</div>


<script>


const STORAGE_KEY="project2Data";
const PASSWORD="3532";


const villageOrder=[
"MUNDRA",
"SADAU",
"KAPAYA",
"BAROI",
"VANDH",
"GOYAR",
"SHEKHADIYA",
"LUNI",
"RAGA",
"HAMIRAMORA",
"MANGRA",
"BORANA"
];


let villageListData=[...villageOrder];


function loadVillageList(){


let list=document.getElementById("villageList");
list.innerHTML="";


villageListData.forEach(v=>{
let opt=document.createElement("option");
opt.value=v;
list.appendChild(opt);
});


}


function getToday(){


let d=new Date();
let y=d.getFullYear();
let m=String(d.getMonth()+1).padStart(2,'0');
let day=String(d.getDate()).padStart(2,'0');


return `${y}-${m}-${day}`;


}


window.onload=function(){


let today=getToday();


dateInput.value=today;
fromDate.value=today;
toDate.value=today;


loadVillageList();


renderTable();


};


function getData(){


return JSON.parse(
localStorage.getItem(STORAGE_KEY)
)||[];


}


function saveData(data){


localStorage.setItem(
STORAGE_KEY,
JSON.stringify(data)
);


}


function sortData(data){


return data.sort((a,b)=>{


if(a[0]!==b[0]){
return a[0].localeCompare(b[0]);
}


let va=villageOrder.indexOf(a[2]);
let vb=villageOrder.indexOf(b[2]);


if(va===-1) va=999;
if(vb===-1) vb=999;


if(va!==vb){
return va-vb;
}


return Number(a[4]||0)-Number(b[4]||0);


});


}


function getFilteredData(){


let data=sortData(getData());


let search=document
.getElementById("searchInput")
.value
.toLowerCase()
.trim();


let from=fromDate.value;
let to=toDate.value;


let words=search.split(" ").filter(Boolean);


let includeWords=words.filter(w=>!w.startsWith("#"));
let excludeWords=words
.filter(w=>w.startsWith("#"))
.map(w=>w.substring(1));


return data.filter(row=>{


let text=row.join(" ").toLowerCase();


for(let word of includeWords){
if(!text.includes(word)){
return false;
}
}


for(let word of excludeWords){
if(text.includes(word)){
return false;
}
}


if(from && row[0]<from)
return false;


if(to && row[0]>to)
return false;


return true;


});


}


function addData(){


let data=getData();


let seller=sellerInput.value.toUpperCase();
let village=villageInput.value.toUpperCase();
let weight=weightInput.value;
let receipt=receiptInput.value;
let car=carInput.value.toUpperCase();


if(!dateInput.value || !seller || !weight){
alert("Date, Seller and Weight required");
return;
}


if(receipt){


if(data.some(r=>r[4]===receipt)){
alert("Duplicate receipt!");
return;
}


}


if(village && !villageListData.includes(village)){
villageListData.push(village);
loadVillageList();
}


let row=[
dateInput.value,
seller,
village,
weight,
receipt,
car
];


data.push(row);


saveData(data);


sellerInput.value="";
villageInput.value="";
weightInput.value="";
receiptInput.value="";
carInput.value="";


renderTable();


}


function renderTable(){


let tbody=document.getElementById("dataList");


tbody.innerHTML="";


let filtered=getFilteredData();


filtered.forEach((row,index)=>{


let tr=document.createElement("tr");


row.forEach(cell=>{


let td=document.createElement("td");
td.textContent=cell;
tr.appendChild(td);


});


let action=document.createElement("td");


action.innerHTML=`
<button onclick="deleteRow(${index})">
Delete
</button>
`;


tr.appendChild(action);


tbody.appendChild(tr);


});


updateTotal();


}


function updateTotal(){


let all=getData();
let filtered=getFilteredData();


let totalAll=all.reduce(
(sum,row)=>sum+(parseFloat(row[3])||0),
0
);


let totalFiltered=filtered.reduce(
(sum,row)=>sum+(parseFloat(row[3])||0),
0
);


document.getElementById("totalAll").textContent=
totalAll;


document.getElementById("totalFiltered").textContent=
totalFiltered+
" | Entries: "+
filtered.length;


}


function deleteRow(index){


verifyPassword(()=>{


let filtered=getFilteredData();


let data=getData();


let row=filtered[index];


let realIndex=data.findIndex(
r=>JSON.stringify(r)===JSON.stringify(row)
);


data.splice(realIndex,1);


saveData(data);


renderTable();


});


}


function verifyPassword(cb){


let p=prompt("Enter password:");


if(p===PASSWORD){
cb();
}else{
alert("Wrong password");
}


}


function clearData(){


localStorage.removeItem(STORAGE_KEY);


renderTable();


}


function downloadExcel(){


let rows=getFilteredData();


if(rows.length===0){
alert("No data");
return;
}


let ws=XLSX.utils.aoa_to_sheet([
["Date","Seller","Village","Weight","Receipt","Car"],
...rows
]);


let wb=XLSX.utils.book_new();


XLSX.utils.book_append_sheet(
wb,
ws,
"Data"
);


XLSX.writeFile(
wb,
"project2_data.xlsx"
);


}


</script>


</body>
</html>
