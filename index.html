<!DOCTYPE html>
<html>
<head>
    <title>Data Entry Form</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.3/xlsx.full.min.js"></script>
    <style>
        body { font-family: Arial; text-align: center; margin-top: 30px; }
        input, select, button { padding: 10px; margin: 5px; text-transform: uppercase; }
        table { width: 90%; margin: auto; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid black; padding: 8px; }
        th { background: #f4f4f4; }
    </style>
</head>
<body>


<h1>Data Entry Form</h1>


<input type="date" id="dateInput">
<input type="text" id="villageInput" placeholder="Village">
<input type="number" id="weightInput" placeholder="Weight">
<input type="number" id="receiptInput" placeholder="Receipt No" oninput="validateReceipt()">


<select id="carInput">
    <option value="">Select Car</option>
    <option>GJ12BX1269</option>
    <option>GJ12BZ1269</option>
</select>


<br>
<button onclick="addData()">Add</button>
<button onclick="verifyPassword(clearData)">Clear All</button>
<button onclick="downloadExcel()">Download Excel</button>


<br><br>
<input type="text" id="searchInput" placeholder="Search..." onkeyup="filterTable()">


<h2>Saved Data</h2>


<table>
<thead>
<tr>
<th>Date</th>
<th>Village</th>
<th>Weight</th>
<th>Receipt</th>
<th>Car</th>
<th>Action</th>
</tr>
</thead>
<tbody id="dataList"></tbody>
</table>


<script>
const PASSWORD = "samra3532";


function setTodayDate() {
    let today = new Date().toISOString().split('T')[0];
    document.getElementById("dateInput").value = today;
}


window.onload = function() {
    setTodayDate();
    loadTable();
};


function loadTable() {
    let data = JSON.parse(localStorage.getItem("dataList")) || [];
    let table = document.getElementById("dataList");
    table.innerHTML = "";


    data.forEach((row, index) => {
        let tr = document.createElement("tr");


        row.forEach(cell => {
            let td = document.createElement("td");
            td.textContent = cell;
            tr.appendChild(td);
        });


        let actionTd = document.createElement("td");


        actionTd.innerHTML = `
            <button onclick="editRow(${index})">Edit</button>
            <button onclick="deleteRow(${index})">Delete</button>
        `;


        tr.appendChild(actionTd);
        table.appendChild(tr);
    });
}


function addData() {
    let date = dateInput.value;
    let village = villageInput.value.toUpperCase();
    let weight = weightInput.value;
    let receipt = receiptInput.value;
    let car = carInput.value;


    if (!date || !village || !weight || !receipt || !car) {
        alert("All fields required");
        return;
    }


    let data = JSON.parse(localStorage.getItem("dataList")) || [];
    data.push([date, village, weight, receipt, car]);


    localStorage.setItem("dataList", JSON.stringify(data));


    loadTable();


    villageInput.value = "";
    weightInput.value = "";
    receiptInput.value = "";
    carInput.value = "";
}


function editRow(index) {
    verifyPassword(() => {
        let data = JSON.parse(localStorage.getItem("dataList"));
        let row = data[index];


        let newVillage = prompt("Village:", row[1]);
        let newWeight = prompt("Weight:", row[2]);
        let newReceipt = prompt("Receipt:", row[3]);
        let newCar = prompt("Car:", row[4]);


        if (newVillage && newWeight && newReceipt && newCar) {
            data[index] = [row[0], newVillage.toUpperCase(), newWeight, newReceipt, newCar];
            localStorage.setItem("dataList", JSON.stringify(data));
            loadTable();
        }
    });
}


function deleteRow(index) {
    verifyPassword(() => {
        let data = JSON.parse(localStorage.getItem("dataList"));
        data.splice(index, 1);
        localStorage.setItem("dataList", JSON.stringify(data));
        loadTable();
    });
}


function filterTable() {
    let input = document.getElementById("searchInput").value.toLowerCase();
    let rows = document.querySelectorAll("#dataList tr");


    rows.forEach(row => {
        let text = row.innerText.toLowerCase();
        row.style.display = text.includes(input) ? "" : "none";
    });
}


function validateReceipt() {
    receiptInput.value = receiptInput.value.replace(/\D/g, "");
}


function verifyPassword(callback) {
    let user = prompt("Enter password:");
    if (user === PASSWORD) {
        callback();
    } else {
        alert("Wrong password");
    }
}


function clearData() {
    localStorage.removeItem("dataList");
    loadTable();
}


function downloadExcel() {
    let data = JSON.parse(localStorage.getItem("dataList")) || [];


    if (data.length === 0) {
        alert("No data");
        return;
    }


    let ws = XLSX.utils.aoa_to_sheet([["Date","Village","Weight","Receipt","Car"], ...data]);
    let wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Data");


    XLSX.writeFile(wb, "data.xlsx");
}
</script>


</body>
</html>
