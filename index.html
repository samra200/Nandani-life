<!DOCTYPE html>
<html>
<head>
    <title>Advanced Data Entry</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.3/xlsx.full.min.js"></script>
    <style>
        body { font-family: Arial; text-align: center; margin: 20px; }
        input, select, button {
            padding: 10px; margin: 5px;
            text-transform: uppercase;
        }


        .table-container {
            overflow-x: auto;
        }


        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            min-width: 700px;
        }


        th, td {
            border: 1px solid black;
            padding: 8px;
        }


        th { background: #f4f4f4; }


        .total-box {
            margin-top: 10px;
            font-weight: bold;
        }


        @media (max-width: 600px) {
            input, select, button {
                width: 90%;
            }
        }
    </style>
</head>
<body>


<h2>Data Entry</h2>


<input type="date" id="dateInput">
<input type="text" id="villageInput" placeholder="Village">
<input type="number" id="weightInput" placeholder="Weight">
<input type="number" id="receiptInput" placeholder="Receipt No">


<select id="carInput">
    <option value="">Select Car</option>
    <option>GJ12BX1269</option>
    <option>GJ12BZ1269</option>
</select>


<br>
<button onclick="addData()">Add</button>
<button onclick="verifyPassword(clearData)">Clear All</button>
<button onclick="downloadExcel()">Download Excel</button>


<br><br>


<input type="text" id="searchInput" placeholder="Search..." onkeyup="applyFilters()">
<input type="date" id="fromDate" onchange="applyFilters()">
<input type="date" id="toDate" onchange="applyFilters()">


<div class="total-box">
    Total (All): <span id="totalAll">0</span> |
    Total (Filtered): <span id="totalFiltered">0</span>
</div>


<div class="table-container">
<table>
<thead>
<tr>
<th>Date</th>
<th>Village</th>
<th>Weight</th>
<th>Receipt</th>
<th>Car</th>
<th>Action</th>
</tr>
</thead>
<tbody id="dataList"></tbody>
</table>
</div>


<script>
const PASSWORD = "samra3532";


function setToday() {
    dateInput.value = new Date().toISOString().split('T')[0];
}


window.onload = () => {
    setToday();
    renderTable();
};


function getData() {
    return JSON.parse(localStorage.getItem("dataList")) || [];
}


function saveData(data) {
    localStorage.setItem("dataList", JSON.stringify(data));
}


function addData() {
    let data = getData();


    let date = dateInput.value;
    let village = villageInput.value.toUpperCase();
    let weight = weightInput.value;
    let receipt = receiptInput.value;
    let car = carInput.value;


    if (!date || !village || !weight || !receipt || !car) {
        alert("All fields required");
        return;
    }


    // Duplicate check
    if (data.some(row => row[3] === receipt)) {
        alert("Duplicate receipt number!");
        return;
    }


    data.push([date, village, weight, receipt, car]);
    saveData(data);


    villageInput.value = "";
    weightInput.value = "";
    receiptInput.value = "";
    carInput.value = "";


    renderTable();
}


function renderTable() {
    let data = getData();
    let table = dataList;
    table.innerHTML = "";


    data.forEach((row, index) => {
        let tr = document.createElement("tr");


        row.forEach(cell => {
            let td = document.createElement("td");
            td.textContent = cell;
            tr.appendChild(td);
        });


        let action = document.createElement("td");
        action.innerHTML = `
            <button onclick="editRow(${index})">Edit</button>
            <button onclick="deleteRow(${index})">Delete</button>
        `;
        tr.appendChild(action);


        table.appendChild(tr);
    });


    applyFilters();
    updateTotal();
}


function applyFilters() {
    let search = searchInput.value.toLowerCase();
    let from = fromDate.value;
    let to = toDate.value;


    let rows = document.querySelectorAll("#dataList tr");


    rows.forEach(row => {
        let text = row.innerText.toLowerCase();
        let date = row.cells[0].innerText;


        let show = true;


        if (search && !text.includes(search)) show = false;
        if (from && date < from) show = false;
        if (to && date > to) show = false;


        row.style.display = show ? "" : "none";
    });


    updateTotal();
}


function updateTotal() {
    let data = getData();
    let totalAll = data.reduce((sum, r) => sum + Number(r[2]), 0);


    let visibleRows = document.querySelectorAll("#dataList tr:not([style*='display: none'])");
    let totalFiltered = 0;


    visibleRows.forEach(r => {
        totalFiltered += Number(r.cells[2].innerText);
    });


    totalAllEl = document.getElementById("totalAll");
    totalFilteredEl = document.getElementById("totalFiltered");


    totalAllEl.innerText = totalAll;
    totalFilteredEl.innerText = totalFiltered;
}


function editRow(index) {
    verifyPassword(() => {
        let data = getData();
        let row = data[index];


        let tr = dataList.children[index];
        tr.innerHTML = "";


        row.forEach((cell, i) => {
            let td = document.createElement("td");
            td.innerHTML = `<input value="${cell}">`;
            tr.appendChild(td);
        });


        let action = document.createElement("td");
        action.innerHTML = `
            <button onclick="saveEdit(${index})">Save</button>
            <button onclick="renderTable()">Cancel</button>
        `;
        tr.appendChild(action);
    });
}


function saveEdit(index) {
    let tr = dataList.children[index];
    let inputs = tr.querySelectorAll("input");


    let newRow = [
        inputs[0].value,
        inputs[1].value.toUpperCase(),
