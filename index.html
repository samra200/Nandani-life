<!DOCTYPE html>
<html>
<head>
    <title>Advanced Data Entry</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.3/xlsx.full.min.js"></script>


    <style>
        body { font-family: Arial; text-align: center; margin: 20px; }


        input, select, button {
            padding: 10px;
            margin: 5px;
            text-transform: uppercase;
        }


        .table-container { overflow-x: auto; }


        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            min-width: 700px;
        }


        th, td {
            border: 1px solid black;
            padding: 8px;
        }


        th { background: #f4f4f4; }


        .total-box {
            margin-top: 10px;
            font-weight: bold;
        }


        @media (max-width: 600px) {
            input, select, button { width: 90%; }
        }
    </style>
</head>


<body>


<h2>Data Entry</h2>


<input type="date" id="dateInput">
<input type="text" id="villageInput" placeholder="Village">
<input type="number" id="weightInput" placeholder="Weight">
<input type="number" id="receiptInput" placeholder="Receipt No">


<select id="carInput">
    <option value="">Select Car</option>
    <option>GJ12BX1269</option>
    <option>GJ12BZ1269</option>
</select>


<br>


<button onclick="addData()">Add</button>
<button onclick="verifyPassword(clearData)">Clear All</button>
<button onclick="downloadExcel()">Download Excel</button>


<br><br>


<input type="text" id="searchInput" placeholder="Search..." onkeyup="renderTable()">
<input type="date" id="fromDate" onchange="renderTable()">
<input type="date" id="toDate" onchange="renderTable()">


<div class="total-box">
    Total (All): <span id="totalAll">0</span> |
    Total (Filtered): <span id="totalFiltered">0</span>
</div>


<div class="table-container">
<table>
<thead>
<tr>
<th>Date</th>
<th>Village</th>
<th>Weight</th>
<th>Receipt</th>
<th>Car</th>
<th>Action</th>
</tr>
</thead>
<tbody id="dataList"></tbody>
</table>
</div>


<script>
const PASSWORD = "3532";


// ✅ Proper local date
function getToday() {
    let d = new Date();
    let y = d.getFullYear();
    let m = String(d.getMonth() + 1).padStart(2, '0');
    let day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
}


window.onload = () => {
    let today = getToday();
    dateInput.value = today;
    fromDate.value = today;
    toDate.value = today;
    renderTable();
};


function getData() {
    return JSON.parse(localStorage.getItem("dataList")) || [];
}


function saveData(data) {
    localStorage.setItem("dataList", JSON.stringify(data));
}


// ✅ Single source of truth
function getFilteredData() {
    let data = getData();


    // sort by receipt
    data.sort((a, b) => Number(a[3]) - Number(b[3]));


    let search = searchInput.value.toLowerCase();
    let from = fromDate.value;
    let to = toDate.value;


    return data.filter(row => {
        let text = row.join(" ").toLowerCase();
        let date = row[0];


        if (search && !text.includes(search)) return false;
        if (from && date < from) return false;
        if (to && date > to) return false;


        return true;
    });
}


// ADD
function addData() {
    let data = getData();


    let row = [
        dateInput.value,
        villageInput.value.toUpperCase(),
        weightInput.value,
        receiptInput.value,
        carInput.value
    ];


    if (row.some(v => !v)) {
        alert("All fields required");
        return;
    }


    if (data.some(r => r[3] === row[3])) {
        alert("Duplicate receipt!");
        return;
    }


    data.push(row);
    saveData(data);


    villageInput.value = "";
    weightInput.value = "";
    receiptInput.value = "";
    carInput.value = "";


    renderTable();
}


// RENDER
function renderTable() {
    let table = dataList;
    table.innerHTML = "";


    let filtered = getFilteredData();


    filtered.forEach((row, index) => {
        let tr = document.createElement("tr");


        row.forEach(cell => {
            let td = document.createElement("td");
            td.textContent = cell;
            tr.appendChild(td);
        });


        let action = document.createElement("td");
        action.innerHTML = `
            <button onclick="editRow(${index})">Edit</button>
            <button onclick="deleteRow(${index})">Delete</button>
        `;
        tr.appendChild(action);


        table.appendChild(tr);
    });


    updateTotal();
}


// TOTAL
function updateTotal() {
    let all = getData();
    let filtered = getFilteredData();


    let totalAll = all.reduce((s, r) => s + (Number(r[2]) || 0), 0);
    let totalFiltered = filtered.reduce((s, r) => s + (Number(r[2]) || 0), 0);


    document.getElementById("totalAll").innerText = totalAll;
    document.getElementById("totalFiltered").innerText =
        totalFiltered + " | Entries: " + filtered.length;
}


// EDIT
function editRow(index) {
    verifyPassword(() => {
        let filtered = getFilteredData();
        let data = getData();


        let row = filtered[index];
        let realIndex = data.findIndex(r => JSON.stringify(r) === JSON.stringify(row));


        let tr = dataList.children[index];
        tr.innerHTML = "";


        row.forEach(cell => {
            let td = document.createElement("td");
            td.innerHTML = `<input value="${cell}">`;
            tr.appendChild(td);
        });


        let action = document.createElement("td");
        action.innerHTML = `
            <button onclick="saveEdit(${realIndex})">Save</button>
            <button onclick="renderTable()">Cancel</button>
        `;
        tr.appendChild(action);
    });
}


function saveEdit(index) {
    let inputs = document.querySelectorAll("#dataList tr input");


    let newRow = [
        inputs[0].value,
        inputs[1].value.toUpperCase(),
        inputs[2].value,
        inputs[3].value,
        inputs[4].value
    ];


    let data = getData();


    if (data.some((r, i) => r[3] === newRow[3] && i !== index)) {
        alert("Duplicate receipt!");
        return;
    }


    data[index] = newRow;
    saveData(data);
    renderTable();
}


// DELETE
function deleteRow(index) {
    verifyPassword(() => {
        let filtered = getFilteredData();
        let data = getData();


        let row = filtered[index];
        let realIndex = data.findIndex(r => JSON.stringify(r) === JSON.stringify(row));


        data.splice(realIndex, 1);
        saveData(data);
        renderTable();
    });
}


// PASSWORD
function verifyPassword(cb) {
    let p = prompt("Enter password:");
    if (p === PASSWORD) cb();
    else alert("Wrong password");
}


// CLEAR
function clearData() {
    localStorage.removeItem("dataList");
    renderTable();
}


// DOWNLOAD
function downloadExcel() {
    let filtered = getFilteredData();


    if (filtered.length === 0) {
        alert("No data");
        return;
    }


    let ws = XLSX.utils.aoa_to_sheet([
        ["Date","Village","Weight","Receipt","Car"],
        ...filtered
    ]);


    let wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Data");


    XLSX.writeFile(wb, "data.xlsx");
}
</script>


</body>
</html>
