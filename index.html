<!DOCTYPE html>
<html>
<head>
  <title>Project 2 - Goods In</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.3/xlsx.full.min.js"></script>
  <style>
    body{
      font-family:Arial;
      text-align:center;
      margin:20px;
    }


    input,button,select{
      padding:10px;
      margin:5px;
      text-transform:uppercase;
    }


    .table-container{
      overflow-x:auto;
    }


    table{
      width:100%;
      border-collapse:collapse;
      margin-top:20px;
      min-width:1150px;
    }


    th,td{
      border:1px solid black;
      padding:8px;
      vertical-align:middle;
    }


    th{
      background:#f4f4f4;
    }


    .total-box{
      margin-top:10px;
      font-weight:bold;
    }


    .row-actions{
      white-space:nowrap;
    }


    .row-actions button{
      margin:2px;
      padding:6px 10px;
    }


    .cell-input{
      width:95%;
      box-sizing:border-box;
      text-transform:uppercase;
    }


    @media(max-width:600px){
      input,button,select{
        width:90%;
      }
    }
  </style>
</head>
<body>
  <h2>PROJECT 2 - GOODS IN</h2>


  <input type="date" id="dateInput">
  <input list="villageList" id="villageInput" placeholder="Village">
  <datalist id="villageList"></datalist>


  <input type="number" id="weightInput" placeholder="Weight">
  <input type="number" id="receiptInput" placeholder="Receipt No">


  <input list="carList" id="carInput" placeholder="Car No">
  <datalist id="carList"></datalist>


  <input list="sellerList" id="sellerInput" placeholder="Seller">
  <datalist id="sellerList">
    <option value="SAMRA GADHVI">
    <option value="MUNNA BHAI">
    <option value="CHETAN BHAI">
  </datalist>


  <br>


  <button onclick="addData()">Add</button>
  <button onclick="downloadExcel()">Download Excel</button>
  <button onclick="verifyPassword(clearData)">Clear All</button>


  <br><br>


  <input type="text" id="searchInput" placeholder="Search or #exclude" onkeyup="renderTable()">
  <input type="date" id="fromDate" onchange="renderTable()">
  <input type="date" id="toDate" onchange="renderTable()">


  <div class="total-box">
    Total: <span id="totalFiltered">0</span> |
    Godown Left: <span id="godownLeft">0</span> |
    Entries: <span id="entryCount">0</span>
  </div>


  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Village</th>
          <th>Weight</th>
          <th>Receipt</th>
          <th>Car</th>
          <th>Seller</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="dataList"></tbody>
    </table>
  </div>


  <script>
    const STORAGE_KEY = "project2Data";
    const PASSWORD = "3532";
    const DEFAULT_SELLER = "SAMRA GADHVI";
    const SELLER_MEMORY_KEY = "project2LastSeller";


    const villageOrder = [
      "GODOWN",
      "MUNDRA",
      "SADAU",
      "KAPAYA",
      "BAROI",
      "VANDH",
      "GOYAR",
      "SHEKHADIYA",
      "LUNI",
      "RAGA",
      "HAMIRAMORA",
      "MANGRA",
      "BORANA"
    ];


    let villageListData = [...villageOrder];
    let editingId = null;
    let nextId = Date.now();


    function $(id){
      return document.getElementById(id);
    }


    function loadVillageList(){
      let list = $("villageList");
      list.innerHTML = "";
      villageListData.forEach(v => {
        let opt = document.createElement("option");
        opt.value = v;
        list.appendChild(opt);
      });
    }


    function getToday(){
      return new Date().toISOString().split("T")[0];
    }


    function makeId(){
      nextId += 1;
      return String(nextId);
    }


    function normalizeRow(row){
      row = row || {};
      if(Array.isArray(row)){
        return {
          id: row[6] || makeId(),
          date: row[0] || "",
          village: row[1] || "",
          weight: row[2] || "",
          receipt: row[3] || "",
          car: row[4] || "",
          seller: row[5] || DEFAULT_SELLER
        };
      }
      return {
        id: row.id || makeId(),
        date: row.date || "",
        village: row.village || "",
        weight: row.weight || "",
        receipt: row.receipt || "",
        car: row.car || "",
        seller: row.seller || DEFAULT_SELLER
      };
    }


    function toArray(row){
      return [
        row.date || "",
        row.village || "",
        row.weight || "",
        row.receipt || "",
        row.car || "",
        row.seller || DEFAULT_SELLER,
        row.id || makeId()
      ];
    }


    function getData(){
      let raw = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      let normalized = raw.map(normalizeRow);
      let changed = JSON.stringify(raw) !== JSON.stringify(normalized.map(toArray));
      if(changed){
        localStorage.setItem(STORAGE_KEY, JSON.stringify(normalized.map(toArray)));
      }
      return normalized;
    }


    function saveData(data){
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data.map(toArray)));
    }


    function sortData(data){
      return data.sort((a,b) => {
        if(a.date !== b.date) return a.date.localeCompare(b.date);


        let va = villageOrder.indexOf(a.village);
        let vb = villageOrder.indexOf(b.village);


        if(va === -1) va = 999;
        if(vb === -1) vb = 999;


        if(va !== vb) return va - vb;


        return Number(a.receipt || 0) - Number(b.receipt || 0);
      });
    }


    function getFilteredData(){
      let data = sortData(getData());
      let search = $("searchInput").value.toLowerCase().trim();
      let words = search.split(" ").filter(Boolean);
      let includeWords = words.filter(w => !w.startsWith("#"));
      let excludeWords = words.filter(w => w.startsWith("#")).map(w => w.substring(1));


      return data.filter(row => {
        let text = [
          row.date, row.village, row.weight, row.receipt, row.car, row.seller
        ].join(" ").toLowerCase();


        if(includeWords.length){
          let found = includeWords.some(word => text.includes(word));
          if(!found) return false;
        }


        for(let word of excludeWords){
          if(text.includes(word)) return false;
        }


        if($("fromDate").value && row.date < $("fromDate").value) return false;
        if($("toDate").value && row.date > $("toDate").value) return false;


        return true;
      });
    }


    function getLastSeller(){
      return localStorage.getItem(SELLER_MEMORY_KEY) || DEFAULT_SELLER;
    }


    function setLastSeller(seller){
      if(seller && seller.trim()){
        localStorage.setItem(SELLER_MEMORY_KEY, seller.trim().toUpperCase());
      }
    }


    function addData(){
      let data = getData();


      let date = $("dateInput").value;
      let village = $("villageInput").value.trim().toUpperCase();
      let weight = $("weightInput").value.trim();
      let receipt = $("receiptInput").value.trim();
      let car = $("carInput").value.trim().toUpperCase();
      let seller = $("sellerInput").value.trim().toUpperCase() || getLastSeller();


      if(!date || !weight){
        alert("Date and Weight required");
        return;
      }


      if(receipt){
        if(data.some(r => (r.receipt || "") === receipt)){
          alert("Duplicate receipt!");
          return;
        }
      }


      if(village && !villageListData.includes(village)){
        villageListData.push(village);
        loadVillageList();
      }


      let row = {
        id: makeId(),
        date,
        village,
        weight,
        receipt,
        car,
        seller
      };


      data.push(row);
      saveData(data);
      setLastSeller(seller);


      $("villageInput").value = "";
      $("weightInput").value = "";
      $("receiptInput").value = "";
      $("carInput").value = "";
      $("sellerInput").value = seller;


      renderTable();
    }


    function renderTable(){
      let tbody = $("dataList");
      tbody.innerHTML = "";


      let filtered = getFilteredData();


      filtered.forEach((row) => {
        let tr = document.createElement("tr");


        if(editingId === row.id){
          let fields = [row.date, row.village, row.weight, row.receipt, row.car, row.seller];


          fields.forEach((cell, i) => {
            let td = document.createElement("td");
            let input = document.createElement("input");
            input.className = "cell-input";
            input.value = cell || "";
            td.appendChild(input);
            tr.appendChild(td);
          });


          let actionTd = document.createElement("td");
          actionTd.className = "row-actions";


          let saveBtn = document.createElement("button");
          saveBtn.textContent = "Save";
          saveBtn.onclick = () => saveRowEdit(row.id);


          let cancelBtn = document.createElement("button");
          cancelBtn.textContent = "Cancel";
          cancelBtn.onclick = () => {
            editingId = null;
            renderTable();
          };


          actionTd.appendChild(saveBtn);
          actionTd.appendChild(cancelBtn);
          tr.appendChild(actionTd);
        } else {
          let values = [row.date, row.village, row.weight, row.receipt, row.car, row.seller];
          values.forEach(cell => {
            let td = document.createElement("td");
            td.textContent = cell || "";
            tr.appendChild(td);
          });


          let actionTd = document.createElement("td");
          actionTd.className = "row-actions";


          let editBtn = document.createElement("button");
          editBtn.textContent = "Edit";
          editBtn.onclick = () => {
            editingId = row.id;
            renderTable();
          };


          let deleteBtn = document.createElement("button");
          deleteBtn.textContent = "Delete";
          deleteBtn.onclick = () => deleteRow(row.id);


          actionTd.appendChild(editBtn);
          actionTd.appendChild(deleteBtn);
          tr.appendChild(actionTd);
        }


        tbody.appendChild(tr);
      });


      updateTotals();
    }


    function saveRowEdit(id){
      let data = getData();
      let index = data.findIndex(r => r.id === id);
      if(index === -1){
        editingId = null;
        renderTable();
        return;
      }


      let row = document.querySelectorAll("#dataList tr");
      let target = null;
      for(let tr of row){
        if(tr.querySelectorAll("input").length === 6){
          target = tr;
          break;
        }
      }
      if(!target){
        editingId = null;
        renderTable();
        return;
      }


      let inputs = target.querySelectorAll("input");
      let newRow = {
        id: data[index].id,
        date: inputs[0].value.trim(),
        village: inputs[1].value.trim().toUpperCase(),
        weight: inputs[2].value.trim(),
        receipt: inputs[3].value.trim(),
        car: inputs[4].value.trim().toUpperCase(),
        seller: inputs[5].value.trim().toUpperCase() || DEFAULT_SELLER
      };


      if(newRow.receipt && data.some((r, i) => i !== index && (r.receipt || "") === newRow.receipt)){
        alert("Duplicate receipt!");
        return;
      }


      if(newRow.village && !villageListData.includes(newRow.village)){
        villageListData.push(newRow.village);
        loadVillageList();
      }


      data[index] = newRow;
      saveData(data);
      setLastSeller(newRow.seller);


      editingId = null;
      renderTable();
    }


    function deleteRow(id){
      let data = getData();
      let index = data.findIndex(r => r.id === id);
      if(index !== -1){
        if(confirm("Delete this row?")){
          data.splice(index, 1);
          saveData(data);
          editingId = null;
          renderTable();
        }
      }
    }


    function updateTotals(){
      let filtered = getFilteredData();
      let total = filtered.reduce((sum, row) => sum + (parseFloat(row.weight) || 0), 0);
      $("totalFiltered").textContent = total;
      $("entryCount").textContent = filtered.length;
      calculateGodownLeft();
    }


    function calculateGodownLeft(){
      let p2 = getData();
      let godown = p2
        .filter(r => r.village === "GODOWN")
        .reduce((sum, row) => sum + (parseFloat(row.weight) || 0), 0);


      let p1 = JSON.parse(localStorage.getItem("dataList")) || [];
      let outTotal = p1.reduce((sum, row) => sum + (parseFloat(row[2]) || 0), 0);


      $("godownLeft").textContent = godown - outTotal;
    }


    function verifyPassword(cb){
      let p = prompt("Password:");
      if(p === PASSWORD){
        cb();
      } else {
        alert("Wrong password");
      }
    }


    function clearData(){
      localStorage.removeItem(STORAGE_KEY);
      editingId = null;
      renderTable();
    }


    function downloadExcel(){
      let rows = getFilteredData();
      let ws = XLSX.utils.aoa_to_sheet([
        ["Date", "Village", "Weight", "Receipt", "Car", "Seller"],
        ...rows.map(r => [r.date, r.village, r.weight, r.receipt, r.car, r.seller])
      ]);
      let wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Data");
      XLSX.writeFile(wb, "project2.xlsx");
    }


    function migrateOldDataOnce(){
      let data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      let fixed = data.map(normalizeRow).map(r => ({
        id: r.id,
        date: r.date,
        village: r.village,
        weight: r.weight,
        receipt: r.receipt,
        car: r.car,
        seller: r.seller || DEFAULT_SELLER
      }));
      localStorage.setItem(STORAGE_KEY, JSON.stringify(fixed.map(toArray)));
    }


    window.onload = function(){
      migrateOldDataOnce();
      let today = getToday();
      $("dateInput").value = today;
      $("fromDate").value = today;
      $("toDate").value = today;
      $("sellerInput").value = getLastSeller();
      loadVillageList();
      renderTable();
    };


    $("villageInput").addEventListener("change", () => $("weightInput").focus());


    $("sellerInput").addEventListener("change", () => {
      setLastSeller($("sellerInput").value);
    });


    $("carInput").addEventListener("change", () => {
      if($("dateInput").value && $("weightInput").value){
        addData();
      }
    });
  </script>
</body>
</html>
